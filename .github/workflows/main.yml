name: VOX Cinemas Showtimes Monitor

on:
  schedule:
    - cron: '*/15 * * * *'

  workflow_dispatch:

concurrency:
  group: vox-showtimes-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-showtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests selenium

      - name: Run VOX Monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u check.py

      - name: Upload Debug Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vox-debug-snapshots
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Save Monitoring State
        if: always()
        run: |
          if [ -f showtimes_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add showtimes_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update VOX monitoring state"
              git push origin HEAD:main
            else
              echo "No state changes to save."
            fi
          else
            echo "State file does not exist."
          fi
          
