name: VOX Cinemas Showtimes Monitor

on:
  workflow_dispatch:

concurrency:
  group: vox-showtimes-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-showtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run VOX Monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python check.py

      - name: Save Monitoring State
        if: always()
        run: |
          if [ -f showtimes_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add showtimes_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update VOX monitoring state"
              git push origin HEAD:main
            else
              echo "No state changes to save."
            fi
          else
            echo "State file does not exist."
          fi
          
